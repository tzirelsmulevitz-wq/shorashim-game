<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="High Scores">
<title>Jack's High Scores</title>
<style>
:root {
  --sky: #eaf4f6; --sand: #fffaf0; --ink: #1d2b45; --muted: #5d6b82; --line: #cfdce3;
  --block: #2f63c9; --block-edge: #1d4596; --block-ink: #ffffff; --good-bg: #dff3e8; --btn: #ffffff;
  --shadow: 0 2px 0 rgba(29,43,69,.12), 0 8px 24px rgba(29,43,69,.08);
  --f-ui: ui-rounded, "SF Pro Rounded", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #111a2b; --sand: #1b2740; --ink: #eef2f8; --muted: #a8b4c8; --line: #2c3a57;
    --block: #4d7fe0; --block-edge: #2c58b0; --good-bg: #173a2c; --btn: #22304d;
    --shadow: 0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #111a2b; --sand: #1b2740; --ink: #eef2f8; --muted: #a8b4c8; --line: #2c3a57;
  --block: #4d7fe0; --block-edge: #2c58b0; --good-bg: #173a2c; --btn: #22304d;
  --shadow: 0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--sky); color: var(--ink); }
body { margin: 0; font-family: var(--f-ui); font-size: 18px; line-height: 1.4; }
a { color: inherit; }
.wrap { max-width: 620px; margin: 0 auto; padding: 18px 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { display: flex; align-items: center; gap: 12px; min-height: 48px; margin-bottom: 8px; }
.topbar h1 { font-size: 24px; margin: 0; flex: 1; }
.iconbtn { min-height: 48px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--btn); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; }
.sub { color: var(--muted); margin: 0 0 16px; }
h2 { font-size: 22px; margin: 26px 0 8px; }
h3 { font-size: 17px; color: var(--muted); margin: 14px 0 6px; }
.card { background: var(--sand); border: 2px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 12px 14px; }
.hsrow { display: grid; grid-template-columns: 48px 1fr auto; gap: 8px; padding: 9px 10px; border-radius: 12px; font-variant-numeric: tabular-nums; }
.hsrow:nth-child(odd) { background: rgba(127,127,127,.08); }
.empty { color: var(--muted); padding: 6px 2px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="topbar"><a class="iconbtn" href="../">‹ Jack's Games</a><h1>High Scores</h1></div>
  <p class="sub">The top 10 rounds for each game, best first. Scores come from this iPad, plus any sent to Claude.</p>
  <div id="boards"></div>
</main>
<script>
const GAMES = [
  { game: 'times', name: 'Times Tables', modes: [{ mode: 'quiz', name: 'Star Quiz', low: false }, { mode: 'clock', name: 'Beat the Clock', low: false }] },
  { game: 'vocab', name: 'Vocabulary', modes: [{ mode: 'quiz', name: 'Word Quiz', low: false }] },
  { game: 'shorashim', name: 'Shorashim', modes: [{ mode: 'quiz', name: 'Quiz', low: false }, { mode: 'match', name: 'Match (fewest mistakes)', low: true }] },
  { game: 'chumash', name: 'Chumash', modes: [{ mode: 'ptest', name: 'Practice Test', low: false }, { mode: 'story', name: 'The Story', low: false }, { mode: 'words', name: 'Word Match (fewest mistakes)', low: true }, { mode: 'cross', name: 'Cross It Out', low: false }, { mode: 'build', name: 'Build the Answer (fewest mistakes)', low: true }, { mode: 'match', name: 'Malach Match (fewest mistakes)', low: true }, { mode: 'quiz', name: 'Word Quiz', low: false }, { mode: 'd-hipuch', name: 'Vav Hahipuch', low: false }, { mode: 'd-tchiliyot', name: 'Prefixes', low: false }, { mode: 'd-sofiyot', name: 'Endings', low: false }, { mode: 'd-mimi', name: 'Who Am I?', low: false }, { mode: 'd-said', name: 'Who Said It?', low: false }, { mode: 'd-tf', name: 'True or False', low: false }] }
];
function rounds() { try { return JSON.parse(localStorage.getItem('jacklog') || '[]').filter(e => e.round); } catch (e) { return []; } }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function render() {
  const all = rounds();
  document.getElementById('boards').innerHTML = GAMES.map(g => `
    <h2>${g.name}</h2>
    ${g.modes.map(m => {
      const rows = all.filter(e => e.game === g.game && e.mode === m.mode)
        .sort((x, y) => (m.low ? x.score - y.score : y.score - x.score) || x.t - y.t).slice(0, 10);
      return `<h3>${m.name}</h3><div class="card">${rows.length
        ? rows.map((r, i) => `<div class="hsrow"><span>#${i + 1}</span><span>${esc(r.label)}</span><span>${new Date(r.t).toLocaleDateString()}</span></div>`).join('')
        : '<div class="empty">No rounds yet.</div>'}</div>`;
    }).join('')}`).join('');
}
render();
</script>
<!-- auto-update -->
<script>
/* Auto-update. Safari can keep showing an old copy of a page for up to 10 minutes after it changes.
   On load: compare this copy with the live one and switch to the new version if they differ.
   If a newer version appears while the page is open, show a tap-to-update button instead,
   so a game in progress isn't lost. The ?v= check means it can never reload in a loop. */
(function () {
  if (!window.fetch || !window.Promise) return;
  var path = location.pathname, busy = false;
  function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function text(url, mode) { return fetch(url, { cache: mode }).then(function (r) { return r.ok ? r.text() : null; }); }
  function go(v) { location.replace(path + '?v=' + v + location.hash); }
  function offer(v) {
    if (document.getElementById('autoUpd')) return;
    var b = document.createElement('button');
    b.id = 'autoUpd'; b.type = 'button'; b.textContent = '✨ New update! Tap to get it';
    b.style.cssText = 'position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:99;border:none;border-radius:999px;padding:14px 26px;font:600 19px system-ui,sans-serif;background:#2f63c9;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;white-space:nowrap';
    b.onclick = function () { go(v); };
    document.body.appendChild(b);
  }
  function check(onLoad) {
    if (busy) return; busy = true;
    Promise.all([text(location.href, 'force-cache'), text(path + '?t=' + Date.now(), 'no-store')]).then(function (r) {
      var mine = r[0], live = r[1];
      if (!mine || !live || mine === live) return;
      var v = hash(live);
      if (new URLSearchParams(location.search).get('v') === v) return;
      if (onLoad) go(v); else offer(v);
    }).catch(function () {}).then(function () { busy = false; });
  }
  check(true);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(false); });
})();
</script>
</body>
</html>
