<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reading">
<title>Jack's Reading</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centered column (max 760px) under a court-stripe band. Story text is set large for reading; answers are full-width tap targets. */
:root {
  --sky: #eaf4f6; --sand: #fffaf0; --ink: #1d2b45; --muted: #5d6b82; --line: #cfdce3;
  --block: #2f63c9; --block-edge: #1d4596; --block-ink: #ffffff;
  --sun: #f2b544; --court-a: #e07a2e; --court-b: #fde3c8;
  --good: #2b9a68; --good-bg: #dff3e8; --bad: #d9534f; --bad-bg: #fbe3e2;
  --btn: #ffffff; --mark: #ffe08a; --mark-ink: #1d2b45;
  --shadow: 0 2px 0 rgba(29,43,69,.12), 0 8px 24px rgba(29,43,69,.08);
  --f-ui: ui-rounded, "SF Pro Rounded", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  --f-read: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #111a2b; --sand: #1b2740; --ink: #eef2f8; --muted: #a8b4c8; --line: #2c3a57;
    --block: #4d7fe0; --block-edge: #2c58b0; --sun: #f5c35f; --court-a: #b8601f; --court-b: #3a2a1c;
    --good: #4cc48d; --good-bg: #173a2c; --bad: #ef7a76; --bad-bg: #44201f; --btn: #22304d;
    --mark: #6b5414; --mark-ink: #fff6dc;
    --shadow: 0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #111a2b; --sand: #1b2740; --ink: #eef2f8; --muted: #a8b4c8; --line: #2c3a57;
  --block: #4d7fe0; --block-edge: #2c58b0; --sun: #f5c35f; --court-a: #b8601f; --court-b: #3a2a1c;
  --good: #4cc48d; --good-bg: #173a2c; --bad: #ef7a76; --bad-bg: #44201f; --btn: #22304d;
  --mark: #6b5414; --mark-ink: #fff6dc;
  --shadow: 0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--sky); color: var(--ink); }
body {
  margin: 0; font-family: var(--f-ui); font-size: 18px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
[hidden] { display: none !important; }

.band { height: 14px; background: repeating-linear-gradient(90deg, var(--court-a) 0 28px, var(--court-b) 28px 56px); }
.wrap {
  max-width: 760px; margin: 0 auto; padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar { display: flex; align-items: center; gap: 12px; min-height: 48px; margin-bottom: 14px; }
.topbar h1 { font-size: 22px; font-weight: 600; margin: 0; flex: 1; text-wrap: balance; }
.iconbtn {
  min-width: 48px; height: 48px; padding: 0 14px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--line); background: var(--btn); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink);
}
.pill { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--muted); white-space: nowrap; }

/* ---------- home ---------- */
.hero { text-align: center; padding: 14px 0 6px; }
.hero .ball { font-size: 56px; line-height: 1; }
.hero h2 { font-size: clamp(36px, 7vw, 52px); margin: 8px 0 4px; line-height: 1.05; }
.hero p { color: var(--muted); margin: 0 auto; max-width: 34ch; }
.list { display: grid; gap: 14px; margin-top: 24px; }
.scard {
  display: flex; align-items: center; gap: 18px; text-align: start; width: 100%;
  background: var(--sand); border: 2px solid var(--line); border-radius: 22px; padding: 18px 20px; box-shadow: var(--shadow); cursor: pointer;
}
.scard:active { transform: translateY(2px); }
.scard .emo { font-size: 46px; line-height: 1; }
.scard b { display: block; font-size: 26px; font-weight: 600; color: var(--ink); }
.scard span { color: var(--muted); font-size: 16px; font-variant-numeric: tabular-nums; }
.scard .new { font-style: normal; display: inline-block; vertical-align: middle; margin-inline-start: 8px; font-size: 14px; font-weight: 700; letter-spacing: .04em; color: #fff; background: var(--court-a); border-radius: 999px; padding: 3px 10px; }
.scard .chev { margin-inline-start: auto; font-size: 30px; color: var(--muted); }

/* ---------- story ---------- */
.story {
  background: var(--sand); border: 2px solid var(--line); border-radius: 24px; box-shadow: var(--shadow);
  padding: 26px clamp(20px, 5vw, 44px) 30px;
}
.tag { display: inline-block; font-size: 15px; font-weight: 600; color: var(--court-a); background: var(--court-b); border-radius: 999px; padding: 4px 12px; }
.story h2 { font-size: clamp(32px, 6vw, 44px); margin: 10px 0 14px; line-height: 1.1; }
.prose { font-family: var(--f-read); font-size: clamp(20px, 2.7vw, 24px); line-height: 1.65; max-width: 62ch; }
.prose p { margin: 0 0 .8em; }
.prose h3 { font-family: var(--f-ui); font-size: 1.12em; line-height: 1.25; margin: 1.1em 0 .35em; color: var(--court-a); }
.prose h3:first-child { margin-top: .2em; }
.prose p:last-child { margin-bottom: 0; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 5px; padding: .05em .15em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.go {
  min-height: 60px; padding: 0 28px; border-radius: 16px; border: none; background: var(--block); color: var(--block-ink);
  font-size: 21px; font-weight: 600; cursor: pointer; box-shadow: inset 0 -4px 0 var(--block-edge);
}
.go:active { transform: translateY(2px); }
.go.wide { width: 100%; margin-top: 20px; }
.ghost { min-height: 56px; padding: 0 22px; border-radius: 16px; border: 2px solid var(--line); background: var(--btn); font-size: 19px; font-weight: 600; cursor: pointer; }

/* ---------- questions ---------- */
.dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
.dot { width: 16px; height: 16px; border-radius: 50%; background: var(--line); }
.dot.g { background: var(--good); } .dot.b { background: var(--bad); } .dot.cur { outline: 3px solid var(--sun); outline-offset: 2px; }
.qcard {
  background: var(--sand); border: 2px solid var(--line); border-radius: 24px; box-shadow: var(--shadow);
  padding: 22px 22px 20px; font-size: clamp(22px, 3.2vw, 27px); font-weight: 600; line-height: 1.35; text-wrap: pretty;
}
.qnum { display: block; font-size: 15px; color: var(--muted); font-weight: 600; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 12px; margin-top: 16px; }
.opt {
  min-height: 66px; width: 100%; text-align: start; padding: 12px 18px; border-radius: 18px; border: 3px solid var(--line);
  background: var(--btn); cursor: pointer; font-size: 20px; font-weight: 600; line-height: 1.3; box-shadow: 0 2px 0 var(--line);
  display: flex; align-items: center; gap: 14px;
}
.opt .let { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--sky); color: var(--muted); font-size: 18px; }
.opt:active { transform: translateY(2px); box-shadow: none; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .let { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake .35s; }
.opt.wrong .let { background: var(--bad); color: #fff; }
.opt[disabled] { cursor: default; }
.opt[disabled]:not(.right):not(.wrong) { opacity: .55; }
.fb { margin-top: 16px; border-radius: 20px; padding: 16px 18px; border: 2px solid; }
.fb.yes { background: var(--good-bg); border-color: var(--good); }
.fb.no { background: var(--bad-bg); border-color: var(--bad); }
.fb h3 { margin: 0 0 6px; font-size: 24px; }
.fb.yes h3 { color: var(--good); } .fb.no h3 { color: var(--bad); }
.fb p { margin: 0; font-size: 19px; }
.fb blockquote { margin: 12px 0 0; padding: 8px 0 8px 14px; border-left: 4px solid var(--sun); font-family: var(--f-read); font-size: 19px; color: var(--ink); }
.row { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; margin-top: 16px; }
.row .go { margin-inline-start: auto; }

/* ---------- look-back sheet ---------- */
.sheetback { position: fixed; inset: 0; background: rgba(10,16,30,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet {
  width: min(760px, 100%); max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--sand); border-radius: 24px 24px 0 0; padding: 0 clamp(20px, 5vw, 40px) calc(24px + env(safe-area-inset-bottom, 0px));
  animation: up .25s ease-out;
}
.sheethead { position: sticky; top: 0; background: var(--sand); display: flex; align-items: center; gap: 12px; padding: 16px 0 12px; border-bottom: 2px solid var(--line); margin-bottom: 16px; }
.sheethead b { flex: 1; font-size: 22px; }

/* ---------- results ---------- */
.result { text-align: center; background: var(--sand); border: 2px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 26px 20px; }
.stars { font-size: 54px; letter-spacing: 6px; line-height: 1; }
.stars .on { color: var(--sun); } .stars .off { color: var(--line); }
.big { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 10px 0 4px; }
.review { margin-top: 20px; display: grid; gap: 10px; text-align: start; }
.review h3 { margin: 4px 0 0; font-size: 18px; color: var(--muted); font-weight: 600; text-align: center; }
.rv { background: var(--sky); border-radius: 16px; padding: 12px 16px; }
.rv b { display: block; font-size: 18px; }
.rv span { color: var(--good); font-weight: 600; }
.actions { display: flex; gap: 12px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }

/* ---------- choose your path ---------- */
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tag.path { color: #fff; background: var(--block); }
.pageno { margin-top: 10px; font-size: 15px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.check { margin-top: 18px; background: var(--sand); border: 3px dashed var(--sun); border-radius: 22px; padding: 18px 18px 16px; }
.check .label { font-size: 14px; font-weight: 700; color: var(--court-a); letter-spacing: .06em; text-transform: uppercase; }
.check .cq { font-size: clamp(21px, 3vw, 25px); font-weight: 600; line-height: 1.3; margin: 6px 0 2px; }
.choices { margin-top: 22px; display: grid; gap: 12px; }
.choices h3 { margin: 0 0 2px; font-size: 24px; text-align: center; }
.choice {
  min-height: 70px; width: 100%; text-align: start; padding: 14px 20px; border: none; border-radius: 18px; cursor: pointer;
  font-size: 21px; font-weight: 600; line-height: 1.3; color: #fff; display: flex; align-items: center; gap: 14px;
}
.choice .arrow { font-size: 26px; flex: none; }
.choice.c0 { background: var(--block); box-shadow: inset 0 -5px 0 var(--block-edge); }
.choice.c1 { background: #d96f26; box-shadow: inset 0 -5px 0 #a24f15; }
.choice.c2 { background: #2b9384; box-shadow: inset 0 -5px 0 #1d6d61; }
.choice:active { transform: translateY(2px); }
.ending { text-align: center; margin-top: 18px; background: var(--sand); border: 2px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 24px 20px; }
.ending .medal { font-size: 66px; line-height: 1; }
.ending .kind { font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--court-a); margin-top: 8px; }
.ending h3 { font-size: clamp(26px, 4vw, 32px); margin: 4px 0 8px; line-height: 1.15; }
.ending .tip { color: var(--muted); max-width: 40ch; margin: 0 auto; }
.found { margin: 20px auto 0; display: grid; gap: 8px; text-align: start; max-width: 520px; }
.found > b { text-align: center; font-variant-numeric: tabular-nums; }
.found div { background: var(--sky); border-radius: 14px; padding: 10px 14px; font-weight: 600; }
.found .no { color: var(--muted); font-weight: 500; }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.popin { animation: pop .3s ease-out; }
@media (prefers-reduced-motion: reduce) { .opt.wrong, .popin, .sheet { animation: none; } }
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<main class="wrap" id="app" aria-live="polite"></main>
<div id="sheet" hidden></div>

<script>
/* Stories. Each question's first answer is the right one (answers are shuffled on screen).
   "look" holds sentences copied exactly from the story; they get highlighted when Jack looks back.
   A "choose your path" adventure has type: 'adventure', start: '<page>', and nodes: { <page>: { paras,
   check?: { q, a, why, look }, choices: [{ text, to }] } or { paras, ending: { kind: super|good|oops, title, tip } } }. */
const STORIES = [
  {
    id: 'grandpas-map', type: 'adventure', title: 'The Map in Zaide’s Garage', topic: 'Treasure hunt', emoji: '🗺️',
    start: 'start',
    nodes: {
      'start': {
        paras: [
          'Jack sneezed. Zaide’s garage was packed with dusty boxes, rusty bikes, and things nobody had touched in fifty years.',
          '“Hey, look at this!” Eitan pulled a rolled-up paper out of an old baseball glove.',
          'It was a map. At the top, in shaky pencil, someone had written: *TREASURE. Do not open until 2026.*',
          'Under that was a drawing of the park down the street, a big X, and a riddle: *Start at the bench with the lion’s head. Walk toward the water, not the trees.*',
          'Ben’s eyes got as round as cookies. “It’s 2026 right now!”',
          'Jack’s heart thumped. A real treasure map! But who made it?'
        ],
        check: { q: 'When was the treasure supposed to be opened?',
          a: ['In 2026', 'Fifty years ago', 'On Jack’s birthday'],
          why: 'The top of the map said not to open it until 2026, and it’s 2026 now!',
          look: ['Do not open until 2026.'] },
        choices: [
          { text: 'Show Zaide the map first', to: 'grandpa' },
          { text: 'Grab a shovel and race to the park!', to: 'bench' }
        ]
      },
      'grandpa': {
        paras: [
          'Zaide put on his glasses and squinted at the map. Then he laughed so hard his belly jiggled like a bowl of jelly.',
          '“I drew this when I was eight years old!” he said. “My friends and I buried a time capsule in that park. A time capsule is a box of special things you hide for people to find in the future.”',
          '“What’s inside?” Jack asked.',
          'Zaide winked. “That’s for you to find out. Here’s my only hint: read every word of the clues very carefully.”',
          'He handed Jack a small shovel. “Be home before dinner, detectives.”'
        ],
        check: { q: 'What is a time capsule?',
          a: ['A box of special things hidden for the future', 'A kind of clock', 'A very old map'],
          why: 'Zaide explains it right after he says it: a box of special things you hide for people to find in the future.',
          look: ['A time capsule is a box of special things you hide for people to find in the future.'] },
        choices: [ { text: 'Run to the park', to: 'bench' } ]
      },
      'bench': {
        paras: [
          'At the park, the three friends found an old stone bench with a lion’s head carved on each end. The lions looked grumpy, like they had been waiting a very long time.',
          'Jack read the riddle out loud again. “Walk toward the water, not the trees.”',
          'On one side of the bench was the duck pond. On the other side was a thick, dark row of pine trees.',
          '“Ooh, the trees are a perfect hiding spot,” said Ben. “I bet it’s in there.”'
        ],
        check: { q: 'How did the stone lions on the bench look?',
          a: ['Grumpy, like they had waited a long time', 'Happy and smiling', 'Fast asleep'],
          why: 'The story says the lions looked grumpy, like they had been waiting a very long time.',
          look: ['The lions looked grumpy, like they had been waiting a very long time.'] },
        choices: [
          { text: 'Walk toward the duck pond', to: 'pond' },
          { text: 'Search the pine trees', to: 'trees' }
        ]
      },
      'trees': {
        paras: [
          'Branches scratched their arms. Pine needles stuck in their hair. Then: *SPLAT!*',
          'Ben stepped into a mud puddle up to his ankle. When he pulled his foot out, his sneaker stayed behind with a loud *SHLURP*.',
          'Eitan laughed so hard he had to sit down on a log. Even Ben started giggling as he fished out his muddy sneaker.',
          'Jack unrolled the map and groaned. “Guys, the riddle said toward the water, NOT the trees. We went the wrong way!”'
        ],
        check: { q: 'What happened to Ben’s sneaker?',
          a: ['It got stuck in the mud', 'A squirrel took it', 'It fell in the pond'],
          why: 'Ben’s foot came out of the mud, but his sneaker stayed behind!',
          look: ['his sneaker stayed behind'] },
        choices: [ { text: 'Go back and head for the pond', to: 'pond' } ]
      },
      'pond': {
        paras: [
          'At the edge of the pond, Jack flipped the map over. On the back was one more clue, so faint they almost missed it: *Find the turtle that never swims. Dig where its nose points.*',
          '“There!” Eitan pointed at a log in the water. A real turtle was sitting on top, soaking up the sun.',
          'But Ben was pointing the other way, at a big gray rock in the grass. It was shaped exactly like a turtle, with a bumpy shell and a little stone head.',
          'Jack read the clue again. A turtle that never swims…'
        ],
        check: { q: 'Where did Jack find the second clue?',
          a: ['On the back of the map', 'Under the lion bench', 'Inside the baseball glove'],
          why: 'Jack flipped the map over and found one more clue on the back.',
          look: ['Jack flipped the map over. On the back was one more clue'] },
        choices: [
          { text: 'Wade out to the real turtle on the log', to: 'soggy' },
          { text: 'Check the rock shaped like a turtle', to: 'rock' }
        ]
      },
      'soggy': {
        paras: [
          'Jack kicked off his sneakers and stepped into the pond. *Brrr!* The water was as cold as a freezer.',
          'He reached for the log. *Plop!* The turtle slid into the water and swam away. There was nothing on the log but green slime.',
          '“No wading in the pond, boys!” called the park ranger.',
          'Dripping and shivering, Jack squished all the way home. The treasure would have to wait for another day.'
        ],
        ending: { kind: 'oops', title: 'The Soggy Ending', tip: 'A real turtle swims! Next time, look for the turtle that never swims.' }
      },
      'rock': {
        paras: [
          'The turtle rock’s little stone nose pointed at a bare patch of dirt about five steps away.',
          'Jack dug. Eitan dug. Ben dug with his hands like a puppy. Dirt flew everywhere.',
          '*CLUNK!* The shovel hit something hard.',
          'Jack brushed away the dirt. It was a rusty metal box with a heavy lock. Taped to the top was a note: *The key is where it all began.*',
          '“Where it all began?” said Ben. “What does that mean?”'
        ],
        check: { q: 'How did Ben dig?',
          a: ['With his hands, like a puppy', 'With a giant shovel', 'He didn’t dig at all'],
          why: 'Ben dug with his hands like a puppy, and dirt flew everywhere!',
          look: ['Ben dug with his hands like a puppy.'] },
        choices: [
          { text: 'Bang the lock open with a rock', to: 'bang' },
          { text: 'Search the lion bench, where the clues started', to: 'lions' },
          { text: 'Race back to the garage, where they found the map', to: 'garage' }
        ]
      },
      'lions': {
        paras: [
          'They carried the heavy box back to the lion bench and searched every inch. Under the seat. Behind the lions. Inside a lion’s mouth.',
          'All they found was an old piece of gum, as hard as a pebble.',
          '“Wait,” said Eitan slowly. “The bench is where the clues started. But where did the whole adventure start?”',
          'Jack’s eyes lit up.'
        ],
        check: { q: 'What did they find at the lion bench?',
          a: ['An old piece of hard gum', 'The key', 'Another map'],
          why: 'All they found was an old piece of gum, as hard as a pebble.',
          look: ['All they found was an old piece of gum, as hard as a pebble.'] },
        choices: [
          { text: 'Race to Zaide’s garage', to: 'garage' },
          { text: 'Forget it. Bang the lock with a rock!', to: 'bang' }
        ]
      },
      'bang': {
        paras: [
          '*CLANG! CLANG! CLANG!* Jack banged the lock with a rock until his arm was sore. The lock didn’t even get a scratch.',
          'So they lugged the heavy box all the way back to Zaide’s house.',
          'Zaide took one look and chuckled. “The key is where it all began,” he said. “Where did you find the map?”',
          'Inside the old baseball glove, tucked in the thumb, was a tiny brass key. It fit perfectly! Inside the box were old baseball cards, a silver whistle, and a photo of Zaide at eight years old, grinning with his friends.'
        ],
        ending: { kind: 'good', title: 'The Helping-Hand Ending', tip: 'You found the treasure, but Zaide had to help with the last clue. Can you solve it all by yourselves?' }
      },
      'garage': {
        paras: [
          'The friends ran all the way back to Zaide’s garage, the box bouncing between them.',
          'Jack grabbed the old baseball glove, where the map had been hiding. He stuck his fingers inside. There, tucked in the thumb, was a tiny brass key!',
          '*Click.* The lock popped open.',
          'Inside were old baseball cards, a silver whistle, and a photo of Zaide at eight years old, grinning with his friends. At the bottom was a letter: *If you solved every clue, you are real detectives. Now bury a treasure of your own for the kids of the future.*',
          'Zaide stood in the doorway, smiling. “Well, detectives,” he said, “what are you going to put in yours?”',
          'Jack, Eitan, and Ben looked at each other and grinned. They already had a plan.'
        ],
        ending: { kind: 'super', title: 'The Super Detective Ending', tip: 'You solved every clue yourselves. That’s real detective reading!' }
      }
    }
  },
  {
    id: 'lucky-pink-stick', title: 'The Lucky Pink Stick', topic: 'Hockey', emoji: '🏒',
    paras: [
      '*CRACK!* With one minute left in the street hockey championship, Jack’s stick snapped clean in half.',

/* ---------- helpers ---------- */
const $app = document.getElementById('app'), $sheet = document.getElementById('sheet');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('reading:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('reading:' + k, JSON.stringify(v)); } catch (e) {} }
};
function prose(s, marks = []) {
  return s.paras.map(p => {
    const head = p.startsWith('## ');
    let h = esc(head ? p.slice(3) : p);
    marks.forEach(m => { const e = esc(m); h = h.split(e).join('<mark>' + e + '</mark>'); });
    h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
    return head ? '<h3>' + h + '</h3>' : '<p>' + h + '</p>';
  }).join('');
}
const starsFor = (s, n) => s === n ? 3 : s >= n - 1 ? 2 : s >= n - 2 ? 1 : 0;
const starRow = k => '<div class="stars">' + [0, 1, 2].map(i => `<span class="${i < k ? 'on' : 'off'}">★</span>`).join('') + '</div>';

/* ---------- sound (starts only after a tap) ---------- */
let soundOn = store.get('sound', true), actx = null;
function tone(freqs, dur = .12) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach(f => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02); t += dur * .9;
    });
  } catch (e) {}
}
const yay = () => tone([523, 659, 784]);
const nope = () => tone([220, 196], .16);

function topbar(back, title, right = '') {
  return `<div class="topbar">
    <button class="iconbtn" id="backBtn">‹ ${back}</button>
    <h1>${title}</h1>${right}
    <button class="iconbtn" id="sndBtn" aria-label="Sound on or off">${soundOn ? '🔊' : '🔈'}</button>
  </div>`;
}
function wireTop(onBack) {
  document.getElementById('backBtn').onclick = onBack;
  const s = document.getElementById('sndBtn');
  s.onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); s.textContent = soundOn ? '🔊' : '🔈'; };
}
const top0 = () => window.scrollTo(0, 0);

/* ---------- HOME: list of stories ---------- */
function home() {
  closeSheet();
  const seen = store.get('seen', []);
  $app.innerHTML = `
    <div class="topbar"><a class="iconbtn" href="../">‹ Jack's Games</a></div>
    <div class="hero"><div class="ball">📖</div><h2>Reading</h2><p>Read a story and answer the questions, or choose your own path!</p></div>
    <div class="list">${STORIES.map(s => {
      const b = store.get('best:' + s.id, null), isNew = !seen.includes(s.id) && b == null;
      const sub = s.type === 'adventure'
        ? `🧭 Choose your path · ${store.get('endings:' + s.id, []).length} of ${endingIds(s).length} endings found`
        : `${esc(s.topic)} · ${s.qs.length} questions${b != null ? ` · Best: ${b} / ${s.qs.length}` : ''}`;
      return `<button class="scard" data-id="${s.id}"><span class="emo">${s.emoji}</span><span><b>${esc(s.title)}${isNew ? '<em class="new">NEW</em>' : ''}</b><span>${sub}</span></span><span class="chev">›</span></button>`;
    }).join('')}</div>`;
  document.querySelectorAll('.scard').forEach(b => b.onclick = () => {
    const s = STORIES.find(x => x.id === b.dataset.id);
    if (s.type === 'adventure') adventure(s); else read(s);
  });
  top0();
}

/* ---------- READ ---------- */
function read(s) {
  const seen = store.get('seen', []);
  if (!seen.includes(s.id)) { seen.push(s.id); store.set('seen', seen); }
  $app.innerHTML = topbar('Stories', '') + `
    <article class="story">
      <span class="tag">${s.emoji} ${esc(s.topic)}</span>
      <h2>${esc(s.title)}</h2>
      <div class="prose">${prose(s)}</div>
    </article>
    <button class="go wide" id="toQs">I’m done reading · Answer the questions ›</button>`;
  wireTop(home);
  document.getElementById('toQs').onclick = () => startQs(s);
  top0();
}

/* ---------- CHOOSE YOUR PATH ---------- */
const ENDING = { super: { medal: '🏆', label: 'Super ending!' }, good: { medal: '⭐', label: 'Good ending' }, oops: { medal: '😅', label: 'Oops ending' } };
const endingIds = s => Object.keys(s.nodes).filter(k => s.nodes[k].ending);
let A = null;
function adventure(s) {
  const seen = store.get('seen', []);
  if (!seen.includes(s.id)) { seen.push(s.id); store.set('seen', seen); }
  A = { s, path: [], right: 0, asked: 0 };
  page(s.start);
}
function page(id) {
  const { s } = A, n = s.nodes[id], pg = { title: s.title, emoji: s.emoji, paras: n.paras };
  A.path.push(id);
  $app.innerHTML = topbar('Stories', '') + `
    <article class="story">
      <div class="tags"><span class="tag path">🧭 Choose your path</span><span class="tag">${s.emoji} ${esc(s.topic)}</span></div>
      ${A.path.length === 1 ? `<h2>${esc(s.title)}</h2>` : `<div class="pageno">Page ${A.path.length}</div>`}
      <div class="prose" id="pgText">${prose(pg)}</div>
    </article>
    <div id="adv"></div>`;
  wireTop(home); top0();
  if (n.ending) endPage(id); else if (n.check) checkFor(n, pg); else showChoices(n, false);
}
function checkFor(n, pg) {
  const c = n.check, opts = shuffle(c.a.map((t, k) => ({ t, ok: k === 0 })));
  const adv = document.getElementById('adv');
  adv.innerHTML = `<div class="check popin"><div class="label">Quick check</div><div class="cq">${esc(c.q)}</div>
    <div class="opts">${opts.map((o, k) => `<button class="opt" data-ok="${o.ok ? 1 : 0}"><span class="let">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div id="cfb"></div></div>`;
  adv.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const ok = b.dataset.ok === '1';
    adv.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.ok === '1') x.classList.add('right'); });
    A.asked++;
    if (ok) { A.right++; yay(); } else { b.classList.add('wrong'); nope(); }
    document.getElementById('pgText').innerHTML = prose(pg, c.look);
    document.getElementById('cfb').innerHTML = `<div class="fb ${ok ? 'yes' : 'no'} popin">
      <h3>${ok ? shuffle(['Yes!', 'Great job!', 'Correct!', 'You got it!'])[0] : 'Not quite.'}</h3>
      <p>${ok ? '' : `The answer is: <b>${esc(c.a[0])}</b>. `}${esc(c.why)}</p></div>
      <div class="row"><button class="ghost" id="showUp">📖 Show me in the story ↑</button></div>`;
    document.getElementById('showUp').onclick = () => { const m = document.querySelector('#pgText mark'); if (m) m.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    showChoices(n, true);
  });
}
function showChoices(n, scroll) {
  const box = document.createElement('div');
  box.className = 'choices popin';
  box.innerHTML = `<h3>${n.choices.length > 1 ? 'You choose! What should they do?' : 'Keep reading…'}</h3>` +
    n.choices.map((ch, k) => `<button class="choice c${k}" data-to="${ch.to}"><span class="arrow">➜</span><span>${esc(ch.text)}</span></button>`).join('');
  document.getElementById('adv').appendChild(box);
  box.querySelectorAll('.choice').forEach(b => b.onclick = () => { tone([392, 523], .1); page(b.dataset.to); });
  if (scroll) setTimeout(() => box.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 120);
}
function endPage(id) {
  const { s } = A, n = s.nodes[id], e = ENDING[n.ending.kind], all = endingIds(s);
  const found = store.get('endings:' + s.id, []), fresh = !found.includes(id);
  if (fresh) { found.push(id); store.set('endings:' + s.id, found); }
  document.getElementById('adv').innerHTML = `
    <div class="ending popin">
      <div class="medal">${e.medal}</div>
      <div class="kind">${e.label}</div>
      <h3>${esc(n.ending.title)}</h3>
      <p class="tip">${esc(n.ending.tip)}</p>
      ${A.asked ? `<p>Quick checks: <b>${A.right} of ${A.asked}</b> right</p>` : ''}
      <div class="found"><b>Endings found: ${found.length} of ${all.length}${fresh && found.length > 1 ? ' · a new one!' : ''}</b>
        ${all.map(k => found.includes(k) ? `<div>${ENDING[s.nodes[k].ending.kind].medal} ${esc(s.nodes[k].ending.title)}</div>` : '<div class="no">🔒 ??? Try a different path to find it</div>').join('')}
      </div>
      <div class="actions"><button class="go" id="again">${found.length < all.length ? 'Start over and find another ending' : 'Play it again'}</button><button class="ghost" id="menu">All stories</button></div>
    </div>`;
  if (n.ending.kind === 'oops') nope(); else yay();
  document.getElementById('again').onclick = () => adventure(s);
  document.getElementById('menu').onclick = home;
}

/* ---------- LOOK BACK (story sheet) ---------- */
function openSheet(s, marks = []) {
  $sheet.innerHTML = `<div class="sheetback" id="sb"><div class="sheet" role="dialog" aria-label="The story">
    <div class="sheethead"><b>${s.emoji} ${esc(s.title)}</b><button class="go" id="closeSheet">Back to the question</button></div>
    <div class="prose">${prose(s, marks)}</div></div></div>`;
  $sheet.hidden = false; document.body.style.overflow = 'hidden';
  document.getElementById('closeSheet').onclick = closeSheet;
  document.getElementById('sb').onclick = e => { if (e.target.id === 'sb') closeSheet(); };
  const m = $sheet.querySelector('mark');
  if (m) setTimeout(() => m.scrollIntoView({ block: 'center' }), 60);
}
function closeSheet() { $sheet.hidden = true; $sheet.innerHTML = ''; document.body.style.overflow = ''; }

/* ---------- QUESTIONS ---------- */
let R = null;
function startQs(s) { R = { s, i: 0, score: 0, res: [], missed: [] }; ask(); }
function ask() {
  const { s, i } = R, q = s.qs[i];
  const opts = shuffle(q.a.map((t, k) => ({ t, ok: k === 0 })));
  const dots = s.qs.map((_, k) => `<span class="dot ${R.res[k] === true ? 'g' : R.res[k] === false ? 'b' : ''} ${k === i ? 'cur' : ''}"></span>`).join('');
  $app.innerHTML = topbar('Stories', '', `<span class="pill">⭐ ${R.score}</span>`) + `
    <div class="dots" aria-label="Question ${i + 1} of ${s.qs.length}">${dots}</div>
    <div class="qcard popin"><span class="qnum">Question ${i + 1} of ${s.qs.length}</span>${esc(q.q)}</div>
    <div class="opts">${opts.map((o, k) => `<button class="opt" data-ok="${o.ok ? 1 : 0}"><span class="let">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div id="after"><div class="row"><button class="ghost" id="peek">📖 Look back at the story</button></div></div>`;
  wireTop(home);
  document.getElementById('peek').onclick = () => openSheet(s);
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b));
  top0();
}
function answer(btn) {
  const { s, i } = R, q = s.qs[i], ok = btn.dataset.ok === '1';
  document.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (b.dataset.ok === '1') b.classList.add('right'); });
  R.res[i] = ok;
  if (ok) { R.score++; yay(); document.querySelector('.pill').textContent = '⭐ ' + R.score; }
  else { btn.classList.add('wrong'); nope(); R.missed.push(q); }
  const last = i === s.qs.length - 1;
  document.getElementById('after').innerHTML = `
    <div class="fb ${ok ? 'yes' : 'no'} popin">
      <h3>${ok ? shuffle(['Yes!', 'Great job!', 'Correct!', 'You got it!'])[0] : 'Not quite.'}</h3>
      <p>${ok ? '' : `The answer is: <b>${esc(q.a[0])}</b>. `}${esc(q.why)}</p>
      <blockquote>${q.look.map(esc).join(' … ')}</blockquote>
    </div>
    <div class="row"><button class="ghost" id="show">📖 Show me in the story</button><button class="go" id="next">${last ? 'See my score ›' : 'Next ›'}</button></div>`;
  document.getElementById('show').onclick = () => openSheet(s, q.look);
  document.getElementById('next').onclick = () => { R.i++; R.i < s.qs.length ? ask() : done(); };
  document.getElementById('next').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ---------- RESULTS ---------- */
function done() {
  const { s, score } = R, n = s.qs.length, k = starsFor(score, n);
  const best = store.get('best:' + s.id, null), isBest = best == null || score > best;
  if (isBest) store.set('best:' + s.id, score);
  $app.innerHTML = topbar('Stories', '') + `
    <div class="result popin">
      ${starRow(k)}
      <div class="big">${score} / ${n}</div>
      <div>${score === n ? 'Perfect! You understood the whole story.' : k >= 2 ? 'Great reading!' : 'Good try! Read it again and try once more.'}${isBest && best != null ? ' New best score!' : ''}</div>
      ${R.missed.length ? `<div class="review"><h3>Let’s look at these again</h3>${R.missed.map(q => `<div class="rv"><b>${esc(q.q)}</b><span>${esc(q.a[0])}</span></div>`).join('')}</div>` : ''}
      <div class="actions">
        <button class="go" id="again">Try the questions again</button>
        <button class="ghost" id="reread">Read the story again</button>
        <button class="ghost" id="menu">All stories</button>
      </div>
    </div>`;
  wireTop(home);
  if (k === 3) yay();
  document.getElementById('again').onclick = () => startQs(s);
  document.getElementById('reread').onclick = () => read(s);
  document.getElementById('menu').onclick = home;
  top0();
}

home();
</script>
<!-- auto-update -->
<script>
/* Auto-update. Safari can keep showing an old copy of a page for up to 10 minutes after it changes.
   On load: compare this copy with the live one and switch to the new version if they differ.
   If a newer version appears while the page is open, show a tap-to-update button instead,
   so a game in progress isn't lost. The ?v= check means it can never reload in a loop. */
(function () {
  if (!window.fetch || !window.Promise) return;
  var path = location.pathname, busy = false;
  function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function text(url, mode) { return fetch(url, { cache: mode }).then(function (r) { return r.ok ? r.text() : null; }); }
  function go(v) { location.replace(path + '?v=' + v + location.hash); }
  function offer(v) {
    if (document.getElementById('autoUpd')) return;
    var b = document.createElement('button');
    b.id = 'autoUpd'; b.type = 'button'; b.textContent = '✨ New update! Tap to get it';
    b.style.cssText = 'position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:99;border:none;border-radius:999px;padding:14px 26px;font:600 19px system-ui,sans-serif;background:#2f63c9;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;white-space:nowrap';
    b.onclick = function () { go(v); };
    document.body.appendChild(b);
  }
  function check(onLoad) {
    if (busy) return; busy = true;
    Promise.all([text(location.href, 'force-cache'), text(path + '?t=' + Date.now(), 'no-store')]).then(function (r) {
      var mine = r[0], live = r[1];
      if (!mine || !live || mine === live) return;
      var v = hash(live);
      if (new URLSearchParams(location.search).get('v') === v) return;
      if (onLoad) go(v); else offer(v);
    }).catch(function () {}).then(function () { busy = false; });
  }
  check(true);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(false); });
})();
</script>
