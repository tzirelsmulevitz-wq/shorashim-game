<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chumash">
<title>Jack's Chumash</title>
<style>
:root {
  --sky: #eaf4f6; --sand: #fffaf0; --ink: #1d2b45; --muted: #5d6b82; --line: #cfdce3;
  --block: #2f63c9; --block-edge: #1d4596; --block-ink: #ffffff; --sun: #f2b544;
  --good: #2b9a68; --good-bg: #dff3e8; --bad: #d9534f; --bad-bg: #fbe3e2; --btn: #ffffff;
  --pen: #1f4fb8; --xpen: #d8342a; --teal: #2f9e8f; --teal-bg: #d8efe9; --mark: #ffe08a; --mark-ink: #1d2b45;
  --shadow: 0 2px 0 rgba(29,43,69,.12), 0 8px 24px rgba(29,43,69,.08);
  --f-ui: ui-rounded, "SF Pro Rounded", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  --f-read: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-heb: "Times New Roman", "Arial Hebrew", "Noto Serif Hebrew", "David", serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #111a2b; --sand: #1b2740; --ink: #eef2f8; --muted: #a8b4c8; --line: #2c3a57;
    --block: #4d7fe0; --block-edge: #2c58b0; --sun: #f5c35f; --good: #4cc48d; --good-bg: #173a2c; --bad: #ef7a76; --bad-bg: #44201f; --btn: #22304d;
    --pen: #8fb3ff; --xpen: #ff6b5f; --teal: #4cc4b3; --teal-bg: #173a36; --mark: #6b5414; --mark-ink: #fff6dc;
    --shadow: 0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #111a2b; --sand: #1b2740; --ink: #eef2f8; --muted: #a8b4c8; --line: #2c3a57;
  --block: #4d7fe0; --block-edge: #2c58b0; --sun: #f5c35f; --good: #4cc48d; --good-bg: #173a2c; --bad: #ef7a76; --bad-bg: #44201f; --btn: #22304d;
  --pen: #8fb3ff; --xpen: #ff6b5f; --teal: #4cc4b3; --teal-bg: #173a36; --mark: #6b5414; --mark-ink: #fff6dc;
  --shadow: 0 2px 0 rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--sky); color: var(--ink); }
body { margin: 0; font-family: var(--f-ui); font-size: 18px; line-height: 1.4; -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
[hidden] { display: none !important; }
button, a { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.band { height: 14px; background: repeating-linear-gradient(90deg, #2f9e8f 0 28px, #d8efe9 28px 56px); }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 48px; margin-bottom: 14px; }
.topbar h1 { font-size: 22px; font-weight: 700; margin: 0; flex: 1; line-height: 1.15; }
.iconbtn { min-width: 48px; height: 48px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--btn); cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; white-space: nowrap; }
.enbtn[aria-pressed="true"] { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.pill { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--muted); white-space: nowrap; }
.he { font-family: var(--f-heb); direction: rtl; }

/* ---------- English help and tap-a-word ---------- */
.en { display: block; font-family: var(--f-ui); direction: ltr; text-align: left; color: var(--muted); font-size: 17px; font-weight: 600; line-height: 1.35; margin-top: 4px; }
.en b { color: var(--xpen); }
body:not(.helper) .en { display: none !important; }
.opt.he .en { text-align: right; font-size: 15px; margin-top: 0; }
.tw .en, .tile .en { text-align: center; font-size: 14px; margin-top: 0; }
.hw { cursor: pointer; border-radius: 6px; }
.hw.on, button.qw.on { background: rgba(242,181,68,.5); }
.bubble { position: fixed; z-index: 50; max-width: min(360px, 92vw); background: var(--ink); color: var(--sky); border-radius: 14px; padding: 8px 14px; font-size: 19px; font-weight: 700; line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,.25); pointer-events: none; animation: pop .18s ease-out; }
.bubble bdi { font-family: var(--f-heb); font-size: 1.3em; }

/* ---------- home ---------- */
.hero { text-align: center; padding: 4px 0 2px; }
.hero .t { font-family: var(--f-heb); font-size: clamp(44px, 10vw, 60px); font-weight: 800; line-height: 1.25; }
.hero .s { font-family: var(--f-heb); font-size: 26px; font-weight: 700; color: var(--muted); }
.hero p { color: var(--muted); margin: 10px auto 0; max-width: 36ch; }
.countdown { display: flex; align-items: center; gap: 14px; max-width: 470px; margin: 16px auto 0; padding: 12px 18px; background: var(--sand); border: 3px solid var(--sun); border-radius: 20px; box-shadow: var(--shadow); text-align: left; }
.countdown .cd-num { flex: none; min-width: 58px; height: 58px; padding: 0 8px; border-radius: 16px; background: var(--sun); color: #1d2b45; display: grid; place-items: center; font-size: 36px; font-weight: 800; font-variant-numeric: tabular-nums; }
.countdown b { display: block; font-size: 20px; line-height: 1.25; }
.countdown span { color: var(--muted); font-size: 16px; }
.ready { background: var(--sand); border: 3px solid var(--good); border-radius: 24px; box-shadow: var(--shadow); padding: 16px 18px 18px; margin-top: 16px; }
.rhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ready h2 { margin: 0; font-size: 23px; }
.rbig { font-size: 30px; font-weight: 800; color: var(--good); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rbig small { font-size: 16px; color: var(--muted); font-weight: 700; }
.bar { height: 14px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 10px 0 12px; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 999px; }
.rlist { display: grid; gap: 8px; }
.rrow { display: grid; grid-template-columns: 30px 1fr auto 64px; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--btn); cursor: pointer; text-align: left; font-size: 17px; }
.rrow.ready { border-color: var(--good); background: var(--good-bg); }
.ricon { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px; background: var(--sky); color: var(--muted); }
.rrow.ready .ricon { background: var(--good); color: #fff; }
.rrow.practicing .ricon { background: var(--sun); color: #1d2b45; }
.rname { font-weight: 700; line-height: 1.25; }
.rname bdi { font-family: var(--f-heb); font-size: 1.1em; color: var(--muted); }
.rcount { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
.rmini { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.rmini i { display: block; height: 100%; background: var(--good); }
.rnote { color: var(--muted); font-size: 15px; margin: 12px 0 0; }
.ready .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.secres { display: grid; gap: 6px; margin-top: 16px; text-align: left; }
.srow2 { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--good-bg); font-weight: 700; }
.srow2.no { background: var(--bad-bg); }
.rv .dshow { font-size: 24px; text-align: right; line-height: 1.5; }
.rv .dshow, .rv .dshow span { color: var(--ink); }
.rv .dshow .mk { color: var(--xpen); }
.step { background: var(--sand); border: 2px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 16px 18px 18px; margin-top: 16px; }
.step .sh { display: flex; align-items: center; gap: 14px; }
.step .num { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--block); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 21px; }
.step.done .num { background: var(--good); }
.step.locked .num { background: var(--line); color: var(--muted); }
.step h2 { margin: 0; font-size: 23px; line-height: 1.2; }
.step p { margin: 3px 0 0; color: var(--muted); font-size: 16px; }
.step .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
.step .best { color: var(--block); font-weight: 700; font-variant-numeric: tabular-nums; }
.lockmsg { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--sky); color: var(--muted); font-weight: 700; text-align: center; }
.lockmsg.shake { animation: shake .35s; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
@media (max-width: 480px) { .modes { grid-template-columns: 1fr; } }
.mode { background: var(--btn); border: 2px solid var(--line); border-radius: 20px; padding: 14px 12px; text-align: center; cursor: pointer; box-shadow: 0 3px 0 var(--line); display: grid; gap: 4px; justify-items: center; align-content: start; }
.mode:active { transform: translateY(2px); box-shadow: none; }
.mode .ico { font-size: 34px; line-height: 1; height: 40px; display: grid; place-items: center; }
.mode b { font-size: 20px; }
.mode span { color: var(--muted); font-size: 15px; }
.mode .best { color: var(--block); font-weight: 700; font-variant-numeric: tabular-nums; }
.sec { margin-top: 30px; }
.sec h2 { font-size: 17px; color: var(--muted); margin: 0 0 10px; text-align: center; }
.sec .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.foot { text-align: center; color: var(--muted); font-size: 15px; margin-top: 22px; }

/* ---------- story ---------- */
.story { background: var(--sand); border: 2px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 22px clamp(18px, 5vw, 40px) 26px; }
.tag { display: inline-block; font-size: 15px; font-weight: 700; color: var(--teal); background: var(--teal-bg); border-radius: 999px; padding: 4px 12px; }
.story h2 { font-size: clamp(28px, 5.5vw, 38px); margin: 10px 0 12px; line-height: 1.15; }
.story .ch { font-size: 16px; font-weight: 700; color: var(--muted); margin-top: 8px; }
.prose { font-family: var(--f-read); font-size: clamp(20px, 2.7vw, 24px); line-height: 1.65; -webkit-user-select: text; user-select: text; }
.prose p { margin: 0 0 .8em; }
.prose p:last-child { margin-bottom: 0; }
mark { background: var(--mark); color: var(--mark-ink); border-radius: 5px; padding: .05em .15em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.check { margin-top: 18px; background: var(--sand); border: 3px dashed var(--sun); border-radius: 22px; padding: 18px 18px 16px; }
.check .label { font-size: 14px; font-weight: 800; color: var(--teal); letter-spacing: .06em; text-transform: uppercase; }
.check .cq { font-size: clamp(21px, 3vw, 25px); font-weight: 700; line-height: 1.3; margin: 6px 0 12px; }
.sopts { display: grid; gap: 10px; }
.sopt { min-height: 62px; width: 100%; text-align: start; padding: 10px 16px; border-radius: 16px; border: 3px solid var(--line); background: var(--btn); cursor: pointer; font-size: 20px; font-weight: 600; line-height: 1.3; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 0 var(--line); }
.sopt .let { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--sky); color: var(--muted); font-size: 17px; font-weight: 700; }
.sopt:active { transform: translateY(2px); box-shadow: none; }
.sopt.right { border-color: var(--good); background: var(--good-bg); }
.sopt.right .let { background: var(--good); color: #fff; }
.sopt.wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake .35s; }
.sopt.wrong .let { background: var(--bad); color: #fff; }
.sopt[disabled] { cursor: default; }
.sopt[disabled]:not(.right):not(.wrong) { opacity: .55; }
.fb { margin-top: 14px; border-radius: 18px; padding: 14px 16px; border: 2px solid; }
.fb.yes { background: var(--good-bg); border-color: var(--good); }
.fb.no { background: var(--bad-bg); border-color: var(--bad); }
.fb h3 { margin: 0 0 4px; font-size: 23px; }
.fb.yes h3 { color: var(--good); } .fb.no h3 { color: var(--bad); }
.fb p { margin: 0; font-size: 19px; }
.srow { display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; margin-top: 14px; }
.wide { width: 100%; margin-top: 20px; }
.rv { background: var(--sky); border-radius: 16px; padding: 12px 16px; text-align: left; }
.rv b { display: block; font-size: 18px; }
.rv span { color: var(--good); font-weight: 700; }
.reviewlist { margin-top: 18px; display: grid; gap: 10px; }
.reviewlist h3 { margin: 0; font-size: 18px; color: var(--muted); text-align: center; }

/* ---------- learn the words ---------- */
.fcard { min-height: 320px; width: 100%; background: var(--sand); border: 2px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; cursor: pointer; text-align: center; }
.fcard .hb { font-family: var(--f-heb); font-size: clamp(54px, 13vw, 84px); font-weight: 800; line-height: 1.3; direction: rtl; }
.fcard .eng { font-size: clamp(30px, 6.5vw, 44px); font-weight: 800; line-height: 1.15; }
.fcard .emo { font-size: 58px; line-height: 1.1; }
.fcard .note { color: var(--muted); font-size: 18px; }
.fcard .hint { color: var(--muted); font-size: 15px; }
.fnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; }
.fnav .iconbtn { min-width: 110px; }

/* ---------- worksheet look ---------- */
.panel { background: var(--sand); border: 2px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 16px 20px 18px; margin-bottom: 14px; transition: background .2s, border-color .2s; }
.panel.ok { background: var(--good-bg); border-color: var(--good); }
.qnum { font-size: 15px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.q { font-size: clamp(26px, 5.4vw, 34px); font-weight: 700; line-height: 1.9; text-align: right; }
.qw { position: relative; display: inline-block; line-height: 1.35; padding: 0 .12em; border-radius: 10px; }
button.qw { font: inherit; color: inherit; background: var(--btn); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); cursor: pointer; padding: 0 .22em; margin: .1em 0; }
button.qw:active { transform: translateY(2px); box-shadow: none; }
.q.locked button.qw { background: transparent; border-color: transparent; box-shadow: none; }
.q.locked button.qw.on { background: rgba(242,181,68,.5); }
.qw.bad { background: var(--bad-bg); border-color: var(--bad); animation: shake .35s; }
.qw svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.qw svg path { fill: none; stroke: var(--xpen); stroke-width: 5; stroke-linecap: round; }
.qw svg.draw path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawx .22s ease-out forwards; }
.qw svg.draw path + path { animation-delay: .2s; }
.ans { color: var(--pen); font-size: clamp(24px, 5vw, 31px); font-weight: 700; line-height: 2; text-align: right; margin-top: 6px; padding: 0 4px;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(2em - 2px), var(--line) calc(2em - 2px), var(--line) 2em); }
.blank { color: var(--muted); padding: 0 1.3em; border-bottom: 4px solid var(--line); }
.blank.cur { border-bottom-color: var(--sun); background: rgba(242,181,68,.18); border-radius: 6px 6px 0 0; animation: pulse 1.3s ease-in-out infinite; }
.fill.new { animation: hl 1.2s ease-out; border-radius: 6px; }
.slot { display: inline-block; width: 2.6em; height: 1.15em; vertical-align: middle; border: 3px dashed var(--sun); border-radius: 10px; }
.say { font-size: 19px; font-weight: 700; color: var(--muted); margin: 14px 0 12px; text-align: center; min-height: 27px; }
.say.yes { color: var(--good); } .say.no { color: var(--bad); }
.say bdi { font-family: var(--f-heb); font-size: 1.25em; }
.opts { display: grid; gap: 10px; }
.opt { min-height: 60px; padding: 8px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--btn); font-size: 20px; font-weight: 700; text-align: start; cursor: pointer; box-shadow: 0 3px 0 var(--line); }
.opt.he { font-size: clamp(22px, 4.6vw, 27px); line-height: 1.5; }
.opt:active { transform: translateY(2px); box-shadow: none; }
.opt:disabled { cursor: default; }
.opt.right { background: var(--good); color: #fff; border-color: var(--good); box-shadow: none; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); box-shadow: none; opacity: .7; animation: shake .35s; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.tw { font-family: var(--f-heb); font-size: clamp(24px, 5vw, 30px); font-weight: 700; line-height: 1.4; min-height: 60px; padding: 6px 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--btn); box-shadow: 0 3px 0 var(--line); cursor: pointer; }
.tw:active { transform: translateY(2px); box-shadow: none; }
.tw.oops { background: var(--bad-bg); border-color: var(--bad); animation: shake .35s; }
.tw.hint { border-color: var(--sun); box-shadow: 0 0 0 4px rgba(242,181,68,.45); }
.mcols { display: grid; grid-template-columns: 1fr 1.5fr; gap: 14px; }
.mcols.even { grid-template-columns: 1fr 1fr; }
.mcol { display: grid; gap: 10px; align-content: start; }
.tile { min-height: 76px; border-radius: 16px; border: 3px solid var(--line); background: var(--btn); cursor: pointer; display: grid; place-items: center; padding: 8px 12px; font-size: clamp(21px, 4.4vw, 26px); font-weight: 700; line-height: 1.4; text-align: center; transition: opacity .3s, transform .15s; }
.tile.heb { font-family: var(--f-heb); }
.tile.eng { font-family: var(--f-ui); font-size: 20px; }
.tile small { display: block; font-size: .62em; color: var(--muted); }
.tile.sel { border-color: var(--sun); transform: scale(1.03); }
.tile.done { border-color: var(--good); background: var(--good-bg); opacity: .55; cursor: default; }
.tile.oops { border-color: var(--bad); background: var(--bad-bg); animation: shake .35s; }
.reveal { margin-top: 10px; }
.dshow { font-family: var(--f-heb); direction: rtl; text-align: center; font-size: clamp(28px, 5.8vw, 38px); font-weight: 700; line-height: 1.7; }
.dshow.big { font-size: clamp(56px, 13vw, 84px); line-height: 1.35; }
.mk { color: var(--xpen); background: rgba(216,52,42,.12); border-radius: 8px; }
.after { margin-top: 10px; font-size: 19px; font-weight: 600; text-align: center; }
.after bdi, .say bdi.he { font-family: var(--f-heb); font-size: 1.25em; }
.mode .heb { font-family: var(--f-heb); font-size: 20px; color: var(--ink); font-weight: 700; }

/* ---------- six words ---------- */
.card { background: var(--sand); border: 2px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 12px; }
.card .w { font-family: var(--f-heb); font-size: 34px; font-weight: 800; }
.card .root { color: var(--muted); font-weight: 700; margin-top: 2px; }
.card .m { font-size: 19px; margin-top: 6px; }
.sheet { background: var(--sand); border: 2px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 24px 16px 22px; text-align: center; transition: background .15s, border-color .15s; }
.sheet.ok { background: var(--good-bg); border-color: var(--good); }
.sheet.no { background: var(--bad-bg); border-color: var(--bad); }
.sheet .w { font-family: var(--f-heb); font-size: clamp(44px, 12vw, 72px); font-weight: 800; line-height: 1.3; }
.sheet .ask { font-size: 18px; color: var(--muted); font-weight: 700; }
.sheet .meaning { font-size: clamp(22px, 5.5vw, 28px); font-weight: 700; line-height: 1.3; }
.gloss { margin-top: 10px; font-size: 18px; font-weight: 600; min-height: 24px; }
.wopt.right { background: var(--good); color: #fff; border-color: var(--good); box-shadow: none; }
.wopt.wrong { background: var(--bad); color: #fff; border-color: var(--bad); box-shadow: none; }

/* ---------- results ---------- */
.dots { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.dot.g { background: var(--good); } .dot.b { background: var(--bad); }
.result { text-align: center; background: var(--sand); border: 2px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 26px 20px; }
.big { font-size: 56px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stars { font-size: 54px; letter-spacing: 6px; line-height: 1; }
.stars .on { color: var(--sun); } .stars .off { color: var(--line); }
.review { margin-top: 16px; text-align: right; color: var(--pen); font-size: 22px; font-weight: 700; line-height: 1.7; }
.unlocked { margin-top: 16px; padding: 14px; border-radius: 16px; background: var(--good-bg); color: var(--good); font-weight: 800; font-size: 20px; }
.actions { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }

.btnbig:active, .ghost:active { transform: translateY(2px); }
.ghost { min-height: 56px; padding: 0 22px; border-radius: 16px; border: 2px solid var(--line); background: var(--btn); font-size: 20px; font-weight: 700; cursor: pointer; }
.rank { margin-top: 18px; text-align: left; }
.rank h3 { font-size: 18px; color: var(--muted); margin: 0 0 8px; text-align: center; }

.hsrow:nth-child(odd) { background: rgba(127,127,127,.08); }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

@keyframes drawx { to { stroke-dashoffset: 0; } }
@keyframes pulse { 50% { background: rgba(242,181,68,.38); } }
@keyframes hl { from { background: rgba(242,181,68,.55); } to { background: transparent; } }
.popin { animation: pop .35s ease-out; }
@media (prefers-reduced-motion: reduce) {
  .popin, .opt.wrong, .sopt.wrong, .tw.oops, .tile.oops, .qw.bad, .blank.cur, .fill.new, .bubble, .lockmsg.shake { animation: none; }

}

function countdownHTML() {
  const t = new Date(TEST.y, TEST.m - 1, TEST.d), now = new Date(); now.setHours(0, 0, 0, 0);
  const days = Math.round((t - now) / 86400000);
  if (days < 0) return '';
  if (days === 0) return `<div class="countdown"><div class="cd-num">⭐</div><div><b>The Chumash test is today!</b><span>You’ve got this, Jack!</span></div></div>`;
  return `<div class="countdown"><div class="cd-num">${days}</div><div><b>${days === 1 ? 'day until the Chumash test' : 'days until the Chumash test'}</b><span>${days === 1 ? `It’s tomorrow, ${TEST.label}! A little review tonight.` : `${TEST.label} · a little review every day helps`}</span></div></div>`;
}

/* After a round, send the log to the jack-progress repo if a token is saved on this iPad. Silent on failure. */
async function sendLog() {
  let t = ''; try { t = localStorage.getItem('jackgh') || ''; } catch (e) {}
  if (!t) return;
  const API = 'https://api.github.com/repos/tzirelsmulevitz-wq/jack-progress/contents/results.json';
  const h = { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  try {
    let sha = null;
    const g = await fetch(API, { headers: h, cache: 'no-store' });
    if (g.status === 200) sha = (await g.json()).sha; else if (g.status !== 404) return;
    const now = new Date().toISOString();
    let entries = []; try { entries = JSON.parse(localStorage.getItem('jacklog') || '[]'); } catch (e) {}
    const bytes = new TextEncoder().encode(JSON.stringify({ updated: now, entries }, null, 1));
    let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
    const body = { message: 'Results ' + now, content: btoa(bin), ...(sha ? { sha } : {}) };
    const p = await fetch(API, { method: 'PUT', headers: { ...h, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (p.ok) { try { localStorage.setItem('jacklastsent', now); } catch (e) {} }
  } catch (e) {}
}

let soundOn = store.get('sound', true), actx = null;
function tone(freqs, dur = .12) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    freqs.forEach(f => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02); t += dur * .9;
    });
  } catch (e) {}
}

/* ============================================================ STEP 2: LEARN THE WORDS */

}
function startWordMatch() {

}
function wordMatchDraw() {
  const t = (v, side) => `<button class="tile ${side === 'H' ? 'heb' : 'eng'}" ${side === 'H' ? 'lang="he"' : ''} data-side="${side}" data-h="${esc(v.h)}">${side === 'H' ? v.h : `${v.emo} ${esc(v.en)}`}</button>`;
  app.innerHTML = topbar('Word Match', `<span class="pill" id="mist">Mistakes: ${W.mistakes}</span>`) + `
    <div class="say" style="margin-top:0" id="say">Tap a Hebrew word, then tap what it means.</div>
    <div class="mcols even"><div class="mcol">${W.left.map(v => t(v, 'H')).join('')}</div><div class="mcol">${W.right.map(v => t(v, 'E')).join('')}</div></div>`;

function wordPick(b) {

/* ============================================================ STEP 3a: ANSWER KEY */

/* ============================================================ STEP 3b: CROSS IT OUT
   Each question: cross out the question word(s), then fill in the blanks of the answer.
   Questions 7 and 8 have no question word to cross out, so they start at the blank.
   Question 5: pick each malach's job. Score = steps done right on the first try. */
const crossTotal = () => SHEET.reduce((s, it) => s + it.q.filter(t => t.x).length + it.a.filter(a => typeof a !== 'string').length, 0) + MALACHIM.length;
function startCross() {
  C = { i: 0, right: 0, total: crossTotal(), marks: [] };
  crossQ();
}
function crossDots() { return `<div class="dots">${Array.from({ length: C.total }, (_, n) => `<span class="dot ${C.marks[n] === true ? 'g' : C.marks[n] === false ? 'b' : ''}"></span>`).join('')}</div>`; }

  app.innerHTML = topbar('Cross It Out', `<span class="pill">${C.i + 1} of ${SEQ.length}</span>`) + crossDots() + `
    <div class="panel" id="panel"><div class="qnum">Question ${it.n}</div>${qHTML(it, nx > 0)}<div class="ans he" lang="he" id="ans" hidden></div><div class="en" id="ansen" hidden></div></div>
    <div class="say" id="say">${nx > 1 ? `Cross out the ${nx} question words.` : nx ? 'Cross out the question word.' : 'No question word to cross out here!'}</div>
    <div class="opts" id="opts"></div>`;
  wireTop();
  document.querySelectorAll('button.qw').forEach(b => b.onclick = () => tapWord(b));

  top0();
}

  if (!C) return;

  if (b.classList.contains('crossed')) return;
  const it = curItem(), t = it.q[+b.dataset.i];
  if (t.x) {
    crossOut(b, true); tick();
    crossStep(!C.miss, `Q${it.n}: cross out ${t.w}`);
    C.left--;
    const say = $('say'); say.className = 'say yes';
    say.innerHTML = `Yes! <bdi lang="he">${t.w}</bdi> means “${esc(GLOSS[t.w])}.” ${C.left ? 'Find the other question word.' : 'Now finish the answer.'}`;
    if (!C.left) { C.phase = 'wait'; document.querySelector('.q').classList.add('locked'); setTimeout(crossFill, 1100); }
  } else {
    nope(); C.miss = true; C.qMiss = true;

    <div class="panel" id="panel"><div class="qnum">Question 5</div><div class="q he" lang="he">${hw(MQ)}</div><div class="en">${MQ_EN}</div><div class="ans he" lang="he" id="ans"></div></div>

}

/* ============================================================ STEP 3c: BUILD THE ANSWER
   The question shows with its question word already crossed out. Jack taps the pieces of
   the answer in order. A wrong piece shakes; after two misses the right piece glows. */
function startBuild() {
  B = { order: shuffle(SHEET.map((_, i) => i)), i: 0, mistakes: 0 };

}
function buildQ() {
  const n = B.order[B.i], it = SHEET[n];
  tapped = false;
  Object.assign(B, { placed: 0, bank: shuffle(it.tiles.map(w => ({ w, used: false }))), missQ: false, missSlot: 0 });
  app.innerHTML = topbar('Build the Answer', `<span class="pill" id="mist">Mistakes: ${B.mistakes}</span>`) + `
    <div class="panel" id="panel"><div class="qnum">Question ${it.n} · ${B.i + 1} of ${SHEET.length}</div>${qHTML(it, false)}<div class="ans he" lang="he" id="ans"></div><div class="en" id="ansen" hidden></div></div>

    <div class="bank he" lang="he" id="bank"></div>

  top0();
}

  P.si = 0; P.miss = false; tapped = false;
  app.innerHTML = topbar(P.kind === 'test' ? '📝 Practice Test' : '⭐ Today’s Practice', `<span class="pill">${P.i + 1} of ${P.items.length}</span>`) + `
    <div class="dots">${P.items.map((_, n) => `<span class="dot ${P.res[n] === true ? 'g' : P.res[n] === false ? 'b' : ''}"></span>`).join('')}</div>
    ${P.kind === 'test' && P.i === 0 ? '<div class="say" style="margin-top:0">Like the real test: one try for each question, no English help.</div>' : ''}
    <div class="panel" id="panel"><div class="qnum">${esc(secName(it.sec))}</div>
      <div class="dshow${it.big ? ' big' : ''}" lang="he" id="dshow">${it.show}</div>
      ${it.enHtml ? `<div class="en" style="text-align:center">${it.enHtml}</div>` : it.en ? `<div class="en" style="text-align:center">${esc(it.en)}</div>` : ''}
      <div class="after" id="after" hidden></div>
    </div>
    <div class="say" id="say"></div>
    <div class="opts" id="opts"></div>`;
  wireTop();
  sessStep();
  top0();
}
function sessStep() {
  const it = P.items[P.i], st = it.steps[P.si];
  $('say').className = 'say'; $('say').innerHTML = bidi(st.ask);
  $('opts').innerHTML = st.choices.map((c, n) => {
    const en = st.he && !st.noEn ? enOf(c) : '';
    return `<button class="opt${st.he ? ' he' : ''}" ${st.he ? 'lang="he"' : ''} data-n="${n}">${esc(c)}${en.trim() ? `<span class="en">${esc(en)}</span>` : ''}</button>`;
  }).join('');
  document.querySelectorAll('#opts .opt').forEach(b => b.onclick = () => sessPick(b, st));
}
function sessPick(b, st) {
  if (!P || b.disabled) return;
  const it = P.items[P.i], ok = st.choices[+b.dataset.n] === st.right;
  if (P.kind === 'test') {   /* one try: show the right answer, then move on */
    document.querySelectorAll('#opts .opt').forEach((x, n) => { x.disabled = true; if (st.choices[n] === st.right) x.classList.add('right'); });
    if (ok) tick(); else { b.classList.add('wrong'); P.miss = true; nope(); }
    if (it.show2) $('dshow').innerHTML = it.show2;
    const at = P.i;
    setTimeout(() => { if (!P || P.i !== at) return; P.si++; if (P.si < it.steps.length) sessStep(); else sessItemDone(); }, ok ? 700 : 1900);
    return;
  }
  if (!ok) { nope(); P.miss = true; b.disabled = true; b.classList.add('wrong'); $('say').className = 'say no'; $('say').textContent = 'Not that one. Try again!'; return; }
  yay();
  if (it.show2) $('dshow').innerHTML = it.show2;
  P.si++;
  if (P.si < it.steps.length) { sessStep(); $('say').className = 'say yes'; $('say').innerHTML = 'Yes! ' + bidi(it.steps[P.si].ask); return; }
  sessItemDone();
}
function sessItemDone() {
  const it = P.items[P.i], ok = !P.miss;
  if (logSkill(it.skill, ok, P.kind === 'test' ? 'ptest' : 'today')) P.helped++;
  P.res.push(ok); if (ok) P.right++;
  const dot = document.querySelectorAll('.dots .dot')[P.i]; if (dot) dot.className = 'dot ' + (ok ? 'g' : 'b');
  if (P.kind === 'test') { P.i++; return P.i < P.items.length ? sessItem() : sessDone(); }
  $('panel').classList.add('ok');
  if (it.after) { $('after').hidden = false; $('after').innerHTML = bidi(it.after); }
  $('say').className = 'say yes'; $('say').textContent = ok ? 'Right the first time!' : 'You got it!';
  $('opts').innerHTML = `<div class="actions" style="margin-top:4px"><button class="btnbig" id="next">${P.i + 1 < P.items.length ? 'Next ›' : 'See how I did ›'}</button></div>`;
  $('next').onclick = () => { P.i++; if (P.i < P.items.length) sessItem(); else sessDone(); };
}
function sessDone() {
  sendLog();
  const k = P.kind, r = P.right, n = P.items.length, stars = r >= n ? 3 : r >= n - 2 ? 2 : r >= n / 2 ? 1 : 0;
  testMode = false; applyHelper();
  const now = chumashReadiness(readLog()), per = {};
  P.items.forEach((it, i) => { const x = per[it.sec] = per[it.sec] || [0, 0]; x[1]++; if (P.res[i]) x[0]++; });
  const missed = P.items.filter((_, i) => !P.res[i]);
  const rt = logRound({ mode: k === 'test' ? 'ptest' : 'today', score: r, total: n, label: `${r} / ${n}`, secs: per });
  const before = P.before, helped = P.helped;
  P = null;
  app.innerHTML = topbar(k === 'test' ? '📝 Practice Test' : '⭐ Today’s Practice') + `
    <div class="result popin">
      ${starsHTML(stars)}
      <div class="big">${r} / ${n}</div>
      <div>${k === 'test' ? (r === n ? 'Perfect! You’re ready for the test!' : r >= n - 2 ? 'Almost there! Look at the ones below.' : 'Good practice! Work on the parts in red.') : 'Right the first time.'}</div>
      <div class="unlocked">Ready for the test: ${now.ready > before ? `${before} → ` : ''}${now.ready} of ${now.total}</div>
      ${helped ? `<p class="rnote">${helped} ${helped === 1 ? 'answer' : 'answers'} had English help, so ${helped === 1 ? 'it doesn’t' : 'they don’t'} count toward Ready yet. Try them again with EN off.</p>` : ''}
      <div class="secres">${SECS.filter(s => per[s.id]).map(s => `<div class="srow2 ${per[s.id][0] === per[s.id][1] ? '' : 'no'}"><span>${esc(s.name)}</span><b>${per[s.id][0]} / ${per[s.id][1]}</b></div>`).join('')}</div>
      ${missed.length ? `<div class="reviewlist"><h3>Look at these again</h3>${missed.map(it => `<div class="rv"><div class="dshow" lang="he">${it.show}</div><span>${bidi(it.answer)}</span></div>`).join('')}</div>` : ''}
      ${k === 'test' ? rankHTML('ptest', false, rt, n) : ''}
      <div class="actions"><button class="btnbig" id="again">${k === 'test' ? 'Take it again' : 'Practice more'}</button><button class="ghost" id="menu">Menu</button></div>
    </div>`;
  wireTop();
  if (stars === 3) yay();
  $('again').onclick = () => startSession(k); $('menu').onclick = home;
  top0();
}

/* ============================================================ THE SIX WORDS */
function study() {
  app.innerHTML = topbar('Study the Words') + `
    ${WORDS.map(x => `<div class="card"><div class="w" lang="he">${x.w}</div><div class="root">Root: <span class="he" lang="he">${x.root}</span></div><div class="m">${x.m}</div></div>`).join('')}
    <div class="actions"><button class="btnbig" id="toQuiz">Word quiz</button></div>`;
  wireTop();
  $('toQuiz').onclick = startQuiz;
  top0();
}
function startQuiz() {
  const qs = [];
  while (qs.length < ROUND) for (const x of shuffle(WORDS)) { if (qs.length < ROUND) {
    const others = shuffle(WORDS.filter(o => o !== x)).slice(0, 3);
    qs.push({ word: x, dir: Math.random() < .5 ? 'wm' : 'mw', opts: shuffle([x, ...others]) }); } }
  Q = { qs, i: 0, right: 0, marks: [], answered: false };
  showQ();
}
function showQ() {
  const q = Q.qs[Q.i];
  const top = q.dir === 'wm'
    ? `<div class="w he" lang="he">${q.word.w}</div><div class="ask">What does it mean?</div>`
    : `<div class="ask">Which word means:</div><div class="meaning">${q.word.m}</div>`;
  const opts = q.opts.map((o, k) => `<button class="opt wopt${q.dir === 'wm' ? '' : ' he'}" data-k="${k}"${q.dir === 'wm' ? '' : ' lang="he"'}>${q.dir === 'wm' ? esc(o.m) : o.w}</button>`).join('');
  app.innerHTML = topbar('Word Quiz', `<span class="pill">${Q.i + 1} of ${ROUND}</span>`) + `
    <div class="dots" id="dots">${Array.from({ length: ROUND }, (_, n) => `<span class="dot ${Q.marks[n] === true ? 'g' : Q.marks[n] === false ? 'b' : ''}"></span>`).join('')}</div>
    <div class="sheet" id="sheet">${top}<div class="gloss" id="gloss"></div></div>
    <div class="opts" id="opts" style="margin-top:16px">${opts}</div>`;
  wireTop();
  Q.answered = false;
  document.querySelectorAll('#opts .opt').forEach(b => b.onclick = () => pickWord(+b.dataset.k));
}
function pickWord(k) {
  if (!Q || Q.answered) return;
  Q.answered = true;
  const q = Q.qs[Q.i], ok = q.opts[k] === q.word;
  logAnswer({ mode: 'quiz', item: `${q.word.w} (${q.word.root})`, kind: q.dir === 'wm' ? 'word to meaning' : 'meaning to word', ok });
  Q.marks[Q.i] = ok; if (ok) { Q.right++; yay(); } else nope();
  $('sheet').className = 'sheet ' + (ok ? 'ok' : 'no');
  $('gloss').textContent = `${q.word.w} · root ${q.word.root} · ${q.word.m}`;
  document.querySelectorAll('#opts .opt').forEach((b, n) => {
    b.disabled = true;
    if (q.opts[n] === q.word) b.classList.add('right'); else if (n === k) b.classList.add('wrong');
  });
  const dot = document.querySelectorAll('#dots .dot')[Q.i]; if (dot) dot.className = 'dot ' + (ok ? 'g' : 'b');
  setTimeout(nextWord, ok ? 900 : 2000);
}
function nextWord() {
  if (!Q) return;
  Q.i++;
  if (Q.i >= ROUND) return finishQuiz();
  showQ();
}
function finishQuiz() {
  sendLog();
  const right = Q.right, stars = right >= ROUND ? 3 : right >= ROUND - 2 ? 2 : right >= ROUND / 2 ? 1 : 0;
  let best = null; try { best = JSON.parse(localStorage.getItem('jackchumash') || 'null'); } catch (e) {}
  const isBest = best == null || right > best;
  if (isBest) { try { localStorage.setItem('jackchumash', JSON.stringify(right)); } catch (e) {} }
  const rt = logRound({ mode: 'quiz', score: right, total: ROUND, label: `${right} / ${ROUND}` });
  Q = null;
  app.innerHTML = topbar('Word Quiz') + `
    <div class="result popin">
      ${starsHTML(stars)}
      <div class="big">${right} / ${ROUND}</div>
      <div>${right === ROUND ? 'Perfect!' : stars >= 2 ? 'Great job!' : 'Keep practicing!'}${isBest && best != null ? ' New best!' : ''}</div>
      ${rankHTML('quiz', false, rt)}
      <div class="actions"><button class="btnbig" id="again">Play again</button><button class="ghost" id="study">Study the words</button><button class="ghost" id="menu">Menu</button></div>
    </div>`;
  wireTop();
  $('menu').onclick = home; $('study').onclick = study; $('again').onclick = startQuiz;
}

home();
</script>
<!-- auto-update -->
<script>
/* Auto-update. Safari can keep showing an old copy of a page for up to 10 minutes after it changes.
   On load: compare this copy with the live one and switch to the new version if they differ.
   If a newer version appears while the page is open, show a tap-to-update button instead,
   so a game in progress isn't lost. The ?v= check means it can never reload in a loop. */
(function () {
  if (!window.fetch || !window.Promise) return;
  var path = location.pathname, busy = false;
  function hash(s) { var h = 5381; for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function text(url, mode) { return fetch(url, { cache: mode }).then(function (r) { return r.ok ? r.text() : null; }); }
  function go(v) { location.replace(path + '?v=' + v + location.hash); }
  function offer(v) {
    if (document.getElementById('autoUpd')) return;
    var b = document.createElement('button');
    b.id = 'autoUpd'; b.type = 'button'; b.textContent = '✨ New update! Tap to get it';
    b.style.cssText = 'position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:99;border:none;border-radius:999px;padding:14px 26px;font:600 19px system-ui,sans-serif;background:#2f63c9;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;white-space:nowrap';
    b.onclick = function () { go(v); };
    document.body.appendChild(b);
  }
  function check(onLoad) {
    if (busy) return; busy = true;
    Promise.all([text(location.href, 'force-cache'), text(path + '?t=' + Date.now(), 'no-store')]).then(function (r) {
      var mine = r[0], live = r[1];
      if (!mine || !live || mine === live) return;
      var v = hash(live);
      if (new URLSearchParams(location.search).get('v') === v) return;
      if (onLoad) go(v); else offer(v);
    }).catch(function () {}).then(function () { busy = false; });
  }
  check(true);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(false); });
})();
</script>
